extends: existence
message: "Participial rider '%s': give it its own verb or sentence, or cut it."
level: suggestion
ignorecase: true
raw:
  - ',\s+[a-z]{3,}ing\s+(?:a|an|the|this|that|these|those|its|their|our|your|my|each|every|all|both|how|what|which|whether|more|less|fewer|new|you|it|them|us|users|readers)\b'
exceptions:
  - concerning
  - during
  - following
  - including
  - regarding
  - nothing
  - something
  - anything
  - everything
  - morning
  - evening
